name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify SSH host is reachable
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          python - <<'PY'
          import os
          import socket
          import sys

          host = os.environ["DEPLOY_HOST"]
          port = 22

          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
              sock.settimeout(10)
              try:
                  sock.connect((host, port))
              except OSError as exc:
                  print(f"Unable to reach SSH endpoint {host}:{port}: {exc}", file=sys.stderr)
                  raise SystemExit(1) from exc

          print(f"SSH endpoint {host}:{port} is reachable")
          PY

      - name: Execute remote ssh commands using passwordless ssh key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd ~/Lifeguard
            git pull origin main
            # Ensure the env uses the updated requirements, if any
            ./venv/bin/pip install -r requirements.txt
            # Restart the service
            if ! sudo -n systemctl restart lifeguard; then
              echo "Deploy user cannot restart lifeguard without passwordless sudo." >&2
              echo "Grant NOPASSWD access for systemctl restart lifeguard on the server." >&2
              exit 1
            fi
            systemctl status lifeguard --no-pager --lines=20
            echo "Deployment successful!"
