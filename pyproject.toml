[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeguard"
version = "0.1.0"
description = "Lifeguard Discord bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.7.0",
  "python-dotenv>=1.0.1",
  "aiohttp>=3.10,<3.14",
  "aiosqlite>=0.20",
  "gidgethub>=5.3",
  "PyJWT[crypto]>=2.9",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "pytest-aiohttp>=1.0",
  "aioresponses>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]
